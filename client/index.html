        <h1>SOLEZ — Samin Yeasar, Full Stack Developer and Founder</h1>
        <p>Samin Yeasar, known as SOLEZ, is a full-stack developer, solo founder, and open-source maker based in Bangladesh. This portfolio presents practical systems made across frontend engineering, backend development, developer tools, programming languages, data exploration, and native interaction design. SOLEZ is the co-founder and CTO of MentorMind, a platform intended to introduce a new culture of help to Bangladesh, and a co-founder of Team Fälschen, a two-person research team working across robotics, physics, and AI.</p>
        <p>Selected work includes Nodex, a browser-native structured-data visualization platform; Vell, a reactive document markup language; URLPad, a private text editor stored in a URL hash; PySketch, a visual programming system for Python Turtle graphics; and 3 Drag Win, a low-latency Windows utility. Visit the <a href="https://github.com/Solez-ai">SOLEZ GitHub profile</a>, <a href="https://solez.mentormind.bd">MentorMind</a>, or contact Samin at <a href="mailto:sheditzofficial918@gmail.com">sheditzofficial918@gmail.com</a>.</p>
